[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cases-faker"
version = "0.1.0"
description = "Realistic synthetic helpdesk/support ticket data (ServiceNow-shaped and friends)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Susanu" }]
keywords = ["testing", "fixtures", "helpdesk", "servicenow", "synthetic-data", "faker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=10.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/alexsusanu/cases-faker"
Source = "https://github.com/alexsusanu/cases-faker"

[project.scripts]
cases-faker = "cases_faker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cases_faker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
